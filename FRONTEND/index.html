<!DOCTYPE html>
<html>
<head>
  <title>Image Upload Dashboard</title>
  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      background: #f4f6f9;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      width: 420px;
      background: #fff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }

    h2 {
      margin-bottom: 20px;
      color: #333;
    }

    input[type="file"] {
      margin: 15px 0;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #4f46e5;
      border: none;
      color: white;
      border-radius: 6px;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      background: #4338ca;
    }

    .status {
      margin-top: 15px;
      font-size: 14px;
      color: #666;
    }

    .error {
      color: red;
    }

    .success {
      color: green;
    }

    img {
      margin-top: 20px;
      width: 100%;
      border-radius: 8px;
      display: none;
    }

    .progress {
      margin-top: 10px;
      height: 5px;
      background: #ddd;
      border-radius: 4px;
      overflow: hidden;
      display: none;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: #4f46e5;
    }
  </style>
</head>

<body>
  <div class="container">
    <h2>Upload Image</h2>

    <form id="uploadForm">
      <input type="file" id="fileInput" required />
      <button type="submit">Upload</button>
    </form>

    <div class="progress"><div class="progress-bar"></div></div>
    <div class="status" id="status"></div>

    <img id="preview" />
  </div>

<script>
const form = document.getElementById("uploadForm");
const status = document.getElementById("status");
const preview = document.getElementById("preview");
const progress = document.querySelector(".progress");
const progressBar = document.querySelector(".progress-bar");

form.addEventListener("submit", async (e) => {
  e.preventDefault();

  const fileInput = document.getElementById("fileInput");
  const file = fileInput.files[0];

  if (!file) {
    status.innerHTML = "Please select a file";
    status.className = "status error";
    return;
  }

  const formData = new FormData();
  formData.append("file", file);

  status.innerHTML = "Uploading...";
  status.className = "status";
  progress.style.display = "block";
  progressBar.style.width = "30%";

  try {
    const res = await fetch("http://98.94.109.171:3000/upload", {
      method: "POST",
      body: formData
    });

    if (!res.ok) {
      const text = await res.text();
      throw new Error(text);
    }

    const data = await res.json();

    progressBar.style.width = "100%";

    status.innerHTML = "Upload successful!";
    status.className = "status success";

    preview.src = "http://98.94.109.171:3000" + data.path;
    preview.style.display = "block";

  } catch (err) {
    progressBar.style.width = "0%";
    status.innerHTML = err.message;
    status.className = "status error";
  }
});
</script>

</body>
</html>
