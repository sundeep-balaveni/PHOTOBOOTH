<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Image Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Poppins", sans-serif;
}

body {
  background: linear-gradient(135deg, #667eea, #764ba2);
  min-height: 100vh;
  color: #fff;
}

header {
  text-align: center;
  padding: 20px;
  font-size: 26px;
  font-weight: 600;
}

.container {
  max-width: 1100px;
  margin: auto;
  padding: 20px;
}

/* Upload Card */
.upload-box {
  background: rgba(255, 255, 255, 0.1);
  backdrop-filter: blur(15px);
  padding: 25px;
  border-radius: 15px;
  text-align: center;
  border: 1px solid rgba(255,255,255,0.2);
  margin-bottom: 30px;
}

.upload-box h3 {
  margin-bottom: 15px;
}

.drop-area {
  border: 2px dashed rgba(255,255,255,0.5);
  padding: 30px;
  border-radius: 10px;
  cursor: pointer;
  transition: 0.3s;
}

.drop-area:hover {
  background: rgba(255,255,255,0.1);
}

button {
  margin-top: 15px;
  padding: 10px 25px;
  background: #fff;
  color: #4f46e5;
  border: none;
  border-radius: 20px;
  font-weight: 600;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  transform: scale(1.05);
}

.status {
  margin-top: 10px;
  font-size: 14px;
}

/* Gallery */
.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 20px;
}

.card {
  background: rgba(255,255,255,0.1);
  backdrop-filter: blur(12px);
  padding: 10px;
  border-radius: 12px;
  transition: 0.3s;
  position: relative;
  overflow: hidden;
}

.card img {
  width: 100%;
  border-radius: 10px;
  transition: 0.3s;
}

.card:hover {
  transform: translateY(-8px);
}

.card:hover img {
  transform: scale(1.05);
}

/* Loader */
.loader {
  border: 4px solid rgba(255,255,255,0.3);
  border-top: 4px solid white;
  border-radius: 50%;
  width: 25px;
  height: 25px;
  animation: spin 1s linear infinite;
  margin: auto;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

</style>
</head>

<body>

<header>🚀 Image Dashboard</header>

<div class="container">

  <div class="upload-box">
    <h3>Upload Image</h3>

    <div class="drop-area" onclick="fileInput.click()">
      Drag & Drop or Click to Upload
      <input type="file" id="fileInput" hidden />
    </div>

    <button onclick="upload()">Upload</button>

    <div class="status" id="status"></div>
  </div>

  <div class="gallery" id="gallery"></div>

</div>

<script>
const API = "http://3.95.176.91:30008";

async function upload() {
  const file = document.getElementById("fileInput").files[0];
  const status = document.getElementById("status");

  if (!file) {
    status.innerText = "⚠️ Select a file";
    return;
  }

  const formData = new FormData();
  formData.append("file", file);

  status.innerHTML = `<div class="loader"></div>`;

  try {
    const res = await fetch(API + "/upload", {
      method: "POST",
      body: formData
    });

    await res.json();

    status.innerText = "✅ Uploaded Successfully!";
    loadImages();

  } catch {
    status.innerText = "❌ Upload failed";
  }
}

async function loadImages() {
  const gallery = document.getElementById("gallery");

  gallery.innerHTML = `<div class="loader"></div>`;

  try {
    const res = await fetch(API + "/images");
    const images = await res.json();

    gallery.innerHTML = "";

    images.forEach(img => {
      const div = document.createElement("div");
      div.className = "card";

      div.innerHTML = `
        <img src="${API}${img.path}" />
      `;

      gallery.appendChild(div);
    });

  } catch {
    gallery.innerHTML = "❌ Failed to load images";
  }
}

loadImages();
</script>

</body>
</html>
