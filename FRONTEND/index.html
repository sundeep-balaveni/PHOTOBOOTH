<!DOCTYPE html>
<html>
<head>
  <title>Image Dashboard</title>
  <style>
    body {
      font-family: "Segoe UI";
      background: #f5f7fb;
      margin: 0;
    }

    header {
      background: #4f46e5;
      color: white;
      padding: 15px 30px;
      font-size: 20px;
    }

    .container {
      padding: 20px;
      max-width: 1000px;
      margin: auto;
    }

    .upload-box {
      background: white;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    input {
      margin: 10px 0;
    }

    button {
      padding: 10px 20px;
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 15px;
    }

    .card {
      background: white;
      padding: 10px;
      border-radius: 10px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
    }

    .card img {
      width: 100%;
      border-radius: 8px;
    }

    .status {
      margin-top: 10px;
    }
  </style>
</head>

<body>

<header>📸 Image Dashboard</header>

<div class="container">

  <div class="upload-box">
    <h3>Upload Image</h3>
    <input type="file" id="fileInput">
    <button onclick="upload()">Upload</button>
    <div class="status" id="status"></div>
  </div>

  <div class="gallery" id="gallery"></div>

</div>

<script>
const API = "http://98.94.109.171:3000";

async function upload() {
  const file = document.getElementById("fileInput").files[0];
  const status = document.getElementById("status");

  if (!file) {
    status.innerText = "Select a file";
    return;
  }

  const formData = new FormData();
  formData.append("file", file);

  status.innerText = "Uploading...";

  try {
    const res = await fetch(API + "/upload", {
      method: "POST",
      body: formData
    });

    const data = await res.json();

    status.innerText = "Uploaded!";
    loadImages();

  } catch (err) {
    status.innerText = "Error uploading";
  }
}

async function loadImages() {
  const gallery = document.getElementById("gallery");

  const res = await fetch(API + "/images");
  const images = await res.json();

  gallery.innerHTML = "";

  images.forEach(img => {
    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <img src="${API}${img.path}" />
    `;

    gallery.appendChild(div);
  });
}

// Load on start
loadImages();
</script>

</body>
</html>
